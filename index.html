<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031722"><link rel="manifest" href="manifest.webmanifest"><title>DiveBreath</title><style>
:root{--bg:#031722;--card:#082b3d;--line:#0d5b75;--cyan:#35e8ff;--text:#eefbff;--muted:#9cc6d2;--ok:#35f0a0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(#031722,#052738);color:var(--text);min-height:100vh}.app{max-width:520px;margin:auto;padding:18px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:800}.brand b{color:var(--cyan)}.sub{color:var(--muted);font-size:13px}.card{background:rgba(8,43,61,.94);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 10px 35px #0005}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat strong{font-size:25px;color:var(--cyan)}button{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;background:linear-gradient(180deg,#55efff,#16bfe6);color:#002431;margin:7px 0}button.secondary{background:#0a3549;color:#dffaff;border:1px solid #157797}.nav{position:fixed;bottom:0;left:0;right:0;background:#041a25ee;border-top:1px solid #15566c;display:flex;justify-content:center}.navin{width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;color:#a9d3dc;font-size:12px;padding:12px 3px;margin:0}.nav button.active{color:var(--cyan)}h2{margin:4px 0 8px}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,select{width:100%;background:#061f2d;color:white;border:1px solid #17617a;border-radius:10px;padding:12px;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.breath{width:190px;height:190px;margin:22px auto;border:4px solid var(--cyan);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 35px #35e8ff55;transition:transform 3.5s ease-in-out;background:#073349}.breath.in{transform:scale(1.22)}.breath.out{transform:scale(.88)}.breath span{text-align:center;font-size:24px;font-weight:800}.warn{font-size:12px;color:#b9d7df;line-height:1.4}.item{padding:12px;border-bottom:1px solid #124b60}.item:last-child{border:0}.big{font-size:34px;color:var(--cyan);font-weight:900}.green{color:var(--ok)}canvas{width:100%;height:190px}.hidden{display:none}.pill{display:inline-block;border:1px solid #14758e;border-radius:99px;padding:5px 9px;color:#bdeefa;font-size:12px}.scenario{font-size:20px;font-weight:800;color:var(--cyan)}</style></head><body><div id="app" class="app"></div><div class="nav"><div class="navin"><button onclick="show('home')">🏠<br>Start</button><button onclick="show('train')">🫁<br>Training</button><button onclick="show('dives')">🤿<br>Tauchgänge</button><button onclick="show('progress')">📊<br>Fortschritt</button></div></div><script>
const A=document.getElementById('app');let timer=null,phase='Einatmen',sec=0;const dives=()=>JSON.parse(localStorage.getItem('dives')||'[]');
function head(t=''){return `<div class=top><div><div class=brand>◢ Dive<b>Breath</b></div><div class=sub>Ruhiger atmen. Bewusster tauchen.</div></div><span class=pill>TEST v0.1</span></div>${t?`<h2>${t}</h2>`:''}`}
function avg(){let d=dives();return d.length?(d.reduce((s,x)=>s+x.rmv,0)/d.length).toFixed(1):'–'}
function show(p){clearInterval(timer); if(p==='home')A.innerHTML=head()+`<div class=stats><div class='card stat'><div class=sub>Ø RMV</div><strong>${avg()}</strong><div class=sub>l/min</div></div><div class='card stat'><div class=sub>Gespeicherte Tauchgänge</div><strong>${dives().length}</strong></div></div><button onclick="show('breath')">▶ ATEMTRAINING STARTEN</button><div class=card><h2>Heute trainieren</h2><div class=item><b>Ruhig atmen</b><br><span class=sub>Kontinuierlich und entspannt</span></div><div class=item><b>Nach Belastung beruhigen</b><br><span class=sub>Zur normalen Atmung zurückfinden</span></div></div><div class='card warn'>DiveBreath ist ein Trainings- und Auswertungstool für Sporttaucher und ersetzt keine Tauchausbildung, Tauchplanung oder einen Tauchcomputer. Beim Gerätetauchen niemals die Luft anhalten.</div>`;
if(p==='train')A.innerHTML=head('Training')+`<div class=card><div class=item><b>🫁 Ruhig atmen</b><br><span class=sub>5 Minuten · Grundlagen</span></div><div class=item><b>🌊 Stress reduzieren</b><br><span class=sub>Nach Belastung wieder ruhig werden</span></div><div class=item><b>⚙️ Hoher Gasverbrauch</b><br><span class=sub>Entspannung statt erzwungenem Sparatmen</span></div></div><button onclick="show('breath')">Atemtrainer öffnen</button><button class=secondary onclick="show('sim')">Tauchsimulation</button>`;
if(p==='breath'){A.innerHTML=head('Atemtrainer')+`<div class=card style='text-align:center'><div id=b class=breath><span id=pt>Bereit</span></div><div id=time class=big>00:00</div><p class=sub>Atme angenehm und kontinuierlich. Erzwinge keinen besonders langsamen Rhythmus.</p><button onclick=startBreath()>Training starten</button></div>`}
if(p==='sim')A.innerHTML=head('Tauchsimulation')+`<div class=card><div class=sub>Tiefe 15 m · Trainingsszenario</div><p class=scenario id=sc>Ruhiges Schweben</p><p id=sd>Atme normal und entspannt. Achte auf unnötige Anspannung.</p><button onclick=nextScenario()>Nächste Situation</button></div><div class='card warn'>Die Simulation wird ausschließlich als Trockenübung verwendet. Keine Smartphone-Bedienung während eines realen Tauchgangs.</div>`;
if(p==='dives')A.innerHTML=head('Tauchgang eintragen')+`<div class=card><div class=grid2><div><label>Flasche (Liter)</label><input id=vol type=number value=12></div><div><label>Zeit (Min.)</label><input id=min type=number value=43></div><div><label>Startdruck (bar)</label><input id=start type=number value=200></div><div><label>Enddruck (bar)</label><input id=end type=number value=60></div></div><label>Ø Tiefe (m)</label><input id=depth type=number value=12><button onclick=saveDive()>RMV berechnen & speichern</button><div id=result></div></div><div class=card>${dives().slice().reverse().map(x=>`<div class=item><b>${x.date}</b> · ${x.depth} m · ${x.min} min<br><span class=green>RMV ${x.rmv.toFixed(1)} l/min</span></div>`).join('')||'<span class=sub>Noch keine Tauchgänge gespeichert.</span>'}</div>`;
if(p==='progress'){let d=dives();A.innerHTML=head('Fortschritt')+`<div class=card><div class=sub>Durchschnittlicher RMV</div><div class=big>${avg()} <small>l/min</small></div><canvas id=chart width=450 height=190></canvas></div><div class=card><b>${d.length}</b> Tauchgänge lokal auf diesem Gerät gespeichert.</div>`;draw(d)} }
function startBreath(){sec=0;let b=document.getElementById('b'),pt=document.getElementById('pt');function swap(){phase=phase==='Einatmen'?'Ausatmen':'Einatmen';pt.textContent=phase;b.className='breath '+(phase==='Einatmen'?'in':'out')}phase='Ausatmen';swap();timer=setInterval(()=>{sec++;document.getElementById('time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec%4===0)swap()},1000)}
let si=0;const ss=[['Leichte Strömung','Du musst stärker schwimmen. Atme entsprechend der Belastung und versuche nicht, Luft zu sparen.'],['Belastung vorbei','Reduziere die Aktivität und lass deine Atmung von selbst wieder ruhiger werden.'],['Maske läuft voll','Bleib ruhig. Konzentriere dich auf die erlernte Fertigkeit und kontinuierliche Atmung.'],['Ruhiges Schweben','Entspanne Schultern und Beine und beobachte deine normale Atmung.']];function nextScenario(){si=(si+1)%ss.length;sc.textContent=ss[si][0];sd.textContent=ss[si][1]}
function saveDive(){let v=+vol.value,s=+start.value,e=+end.value,m=+min.value,d=+depth.value;if(!(v>0&&s>e&&m>0&&d>=0))return result.innerHTML='<p>Bitte Werte prüfen.</p>';let used=(s-e)*v,ata=1+d/10,rmv=used/m/ata;let ar=dives();ar.push({date:new Date().toLocaleDateString('de-DE'),depth:d,min:m,rmv});localStorage.setItem('dives',JSON.stringify(ar));result.innerHTML=`<p class=big>${rmv.toFixed(1)} l/min</p><p class=sub>Oberflächenbezogener Gasverbrauch (vereinfachte Berechnung).</p>`}
function draw(d){let c=document.getElementById('chart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#35e8ff';x.lineWidth=3;if(!d.length){x.fillStyle='#9cc6d2';x.font='16px sans-serif';x.fillText('Noch keine Daten',140,95);return}let vals=d.slice(-10).map(z=>z.rmv),max=Math.max(...vals,25),min=Math.min(...vals,10);x.beginPath();vals.forEach((v,i)=>{let px=20+i*(410/Math.max(vals.length-1,1)),py=165-(v-min)/(max-min||1)*130;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
show('home');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
